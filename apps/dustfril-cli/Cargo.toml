[package]
name = "dustfril-cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "dfr"
path = "src/main.rs"

[dependencies]
dustfril-core = { path = "../../crates/dustfril-core" }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"

[dev-dependencies]
tempfile = "3.0"