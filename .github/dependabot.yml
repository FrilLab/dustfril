version: 2

updates:
  - package-ecosystem: 'cargo'
    directory: '/'

    schedule:
      interval: 'monthly'

    open-pull-requests-limit: 3

    groups:
      cargo-dependencies:
        patterns:
          - '*'

    commit-message:
      prefix: 'deps'

    labels:
      - 'dependencies'

  - package-ecosystem: 'github-actions'
    directory: '/'

    schedule:
      interval: 'monthly'

    groups:
      github-actions:
        patterns:
          - '*'

    labels:
      - 'dependencies'
