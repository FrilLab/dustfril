name: Bug Report
description: Report a reproducible problem in DustFril
title: '[BUG] '
labels:
  - bug

body:
  - type: textarea
    id: bug
    attributes:
      label: Bug Description
      description: Clearly and concisely describe the bug.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps To Reproduce
      description: Steps to reproduce the issue.
      placeholder: |
        1. Run ...
        2. Execute ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: Describe what you expected to happen.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: Describe what actually happened.
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: OS

  - type: input
    id: rust
    attributes:
      label: Rust Version

  - type: input
    id: cargo
    attributes:
      label: Cargo Version

  - type: input
    id: version
    attributes:
      label: DustFril Version or Commit

  - type: textarea
    id: logs
    attributes:
      label: Logs or Screenshots
      description: Paste relevant logs, error output, or screenshots.
      render: shell
